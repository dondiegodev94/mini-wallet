name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para revisar el historial de commits

      - name: Importar clave pública GPG
        run: echo "${{ secrets.GPG_PUBLIC_KEY }}" | gpg --import

      - name: Verificar firmas GPG en los commits
        run: |
          # Revisa todos los commits en el PR actual para verificar que tengan firma válida
          for commit in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git verify-commit $commit > /dev/null 2>&1; then
              echo "❌ Error: El commit $commit no está firmado con GPG."
              exit 1
            fi
          done
          echo "✅ Todos los commits están firmados correctamente."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar TypeScript
        run: pnpm type-check

      - name: Ejecutar Linter
        run: pnpm lint

      - name: Ejecutar Pruebas Unitarias
        run: pnpm test

      - name: Build de producción
        run: pnpm build
        env:
          # Las E2E corren sobre este build: el escenario TIMEOUT usa un límite corto (SPEC-CONF-R25).
          NEXT_PUBLIC_TRANSFER_TIMEOUT_MS: "3000"

      - name: Instalar navegador para E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar Pruebas E2E
        run: pnpm test:e2e

      - name: Publicar reporte E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
